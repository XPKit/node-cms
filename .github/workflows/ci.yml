name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Both ends of what package.json admits: the version the consumers run, and the LTS that
      # `>=24` opens the door to. A range nothing exercises is a claim, not a guarantee.
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Not `npm run lint`: that script is `eslint --fix`, which rewrites files rather than
      # reporting, so it would pass on code it had just edited. lint:check is the reporting one.
      - name: Lint
        run: npm run lint:check

      # Blocking on purpose. It reports nothing today, and a job nobody is required to read is a job
      # nobody reads. An intentional standalone script belongs in knip.config.js as an entry point.
      - name: Knip
        run: npm run knip

      # Runs the unit suite and then the integration suite, both under c8. The coverage summary is
      # printed rather than gated: a threshold set at today's number would only freeze it there.
      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      # dist/ is committed (see README, "Releasing"). A dependency change can alter the bundle, so
      # without this a lockfile-only merge silently leaves the shipped admin built from older
      # versions. The build is deterministic, so a clean tree here is a stable signal.
      #
      # One leg only. dist/ is built and committed on a developer's machine, and this asks whether
      # that build is current - not whether two node majors emit identical bytes, which is a
      # different claim and not one the committed bundle needs to satisfy.
      - name: Committed dist/ matches the build
        if: matrix.node == '22'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git status --porcelain --untracked-files=all -- dist
            git diff --stat -- dist
            exit 1
          fi
          echo "dist/ matches the build."
